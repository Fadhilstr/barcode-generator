# ============================================================
# Nginx Reverse Proxy Gateway — Wahana Express Scan App
# ============================================================
# Rate Limit Zone (Maksimal 5 request login per menit per IP)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_status 429;

# Structured JSON Analytics Log Format untuk Loki & Promtail
log_format json_analytics escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"http_referrer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
'}';

# WebSocket Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# 1. HTTP Server (Port 80)
# Dapat digunakan langsung atau redirect otomatis ke HTTPS di produksi
# ------------------------------------------------------------
server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log json_analytics;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ============================================================
    # Security Headers (OWASP & QA Recommended)
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://localhost:9090;" always;

    # Endpoint Login dengan Rate Limiting
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://backend:5000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Swagger UI & OpenAPI Specification (Direct Nginx Static Serving)
    # Mandiri & tahan banting: Tetap aktif meski Backend Perl mati/error
    # ============================================================
    location = /api/openapi.yaml {
        alias /etc/nginx/html/scanresi.yaml;
        default_type text/yaml;
        add_header Access-Control-Allow-Origin *;
    }

    location = /api/openapi.yml {
        alias /etc/nginx/html/scanresi.yaml;
        default_type text/yaml;
        add_header Access-Control-Allow-Origin *;
    }

    location = /api/docs {
        alias /etc/nginx/html/swagger-ui.html;
        default_type text/html;
        add_header Content-Security-Policy "default-src 'self' https://unpkg.com data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://unpkg.com 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://unpkg.com 'unsafe-inline' 'unsafe-eval'; img-src 'self' https://unpkg.com data:; font-src 'self' https://fonts.gstatic.com data:;" always;
    }

    location = /api/docs/ {
        alias /etc/nginx/html/swagger-ui.html;
        default_type text/html;
        add_header Content-Security-Policy "default-src 'self' https://unpkg.com data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://unpkg.com 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://unpkg.com 'unsafe-inline' 'unsafe-eval'; img-src 'self' https://unpkg.com data:; font-src 'self' https://fonts.gstatic.com data:;" always;
    }

    # API Proxy -> Perl Backend uWSGI PSGI Server
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================================
    # Observability: Grafana Web UI & Live WebSocket Proxy
    # ============================================================
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    # Frontend Proxy -> Quasar Dev Server (Port 9000)
    location / {
        proxy_pass http://frontend:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hot Module Replacement (HMR) WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

