global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Perl Backend & Scanner Telemetry Metrics
  - job_name: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['backend:5000']
        labels:
          service: 'backend'
          environment: 'production'

  # 3. Container & Infrastructure Metrics (cAdvisor)
  - job_name: 'cadvisor'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'infrastructure'
          environment: 'production'
    metric_relabel_configs:
      - source_labels: [image]
        regex: '.*scan-resi-backend.*'
        target_label: name
        replacement: 'wahana_scan_backend'
      - source_labels: [image]
        regex: '.*scan-resi-frontend.*'
        target_label: name
        replacement: 'wahana_scan_frontend'
      - source_labels: [image]
        regex: '.*mariadb.*'
        target_label: name
        replacement: 'wahana_scan_db'
      - source_labels: [image]
        regex: '.*nginx.*'
        target_label: name
        replacement: 'wahana_scan_nginx'
      - source_labels: [image]
        regex: '.*prometheus.*'
        target_label: name
        replacement: 'wahana_scan_prometheus'
      - source_labels: [image]
        regex: '.*loki.*'
        target_label: name
        replacement: 'wahana_scan_loki'
      - source_labels: [image]
        regex: '.*promtail.*'
        target_label: name
        replacement: 'wahana_scan_promtail'
      - source_labels: [image]
        regex: '.*grafana/grafana.*'
        target_label: name
        replacement: 'wahana_scan_grafana'
      - source_labels: [image]
        regex: '.*cadvisor.*'
        target_label: name
        replacement: 'wahana_scan_cadvisor'
      - source_labels: [interface]
        regex: 'br-.*'
        target_label: name
        replacement: 'wahana_network_bridge'
