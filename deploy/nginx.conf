
# =====================================================================
# Dijak Express — Konfigurasi Nginx Produksi & Gateway
#
# Arsitektur (PRD bagian 7):
#   Browser → Nginx (Reverse Proxy & Static Cache)
#              ├─ /          → Static PWA (dist/pwa atau dist/spa)
#              └─ /api/      → Perl Backend (Port 5000 / 8080)
#
# Petunjuk Deployment:
#   1. npm run build:pwa
#   2. Salin isi dist/pwa ke /var/www/dijak-express/dist/pwa (atau sesuaikan root)
#   3. Letakkan SSL cert di /etc/nginx/ssl/dijak-express.crt & .key
#   4. sudo cp deploy/nginx.conf /etc/nginx/sites-available/dijak-express
#   5. sudo ln -sf /etc/nginx/sites-available/dijak-express /etc/nginx/sites-enabled/
#   6. sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# ---------------------------------------------------------------
# 1. HTTP Server (Port 80) — Redirect ke HTTPS atau Dev Server
# ---------------------------------------------------------------
server {
    listen      80;
    server_name _;

    # ===========================================================
    # Security Headers (OWASP Recommended)
    # ===========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://localhost:9090;" always;

    # Opsi Redirect Otomatis ke HTTPS di Produksi:
    # return 301 https://$host$request_uri;

    # -----------------------------------------------------------
    # Static PWA (Quasar build output) — vueRouterMode 'hash'
    # -----------------------------------------------------------
    root  /var/www/dijak-express/dist/pwa;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # -----------------------------------------------------------
    # REST API — Reverse Proxy ke Perl Backend (uWSGI / Server.pl)
    # -----------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---------------------------------------------------------------
# 2. HTTPS Server (Port 443) — TLS/SSL Konfigurasi Produksi
# ---------------------------------------------------------------
server {
    listen      443 ssl http2;
    server_name _;

    # Konfigurasi Sertifikat SSL
    ssl_certificate     /etc/nginx/ssl/dijak-express.crt;
    ssl_certificate_key /etc/nginx/ssl/dijak-express.key;

    # Protokol & Cipher Aman
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # ===========================================================
    # Security Headers (OWASP Recommended)
    # ===========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' http://localhost:3000 http://127.0.0.1:3000 http://localhost:9090;" always;

    root  /var/www/dijak-express/dist/pwa;
    index index.html;

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
