# ============================================================
# Docker Compose — Wahana Express Scan App Full Stack
# (4 Container: Database + Backend Perl uWSGI + Frontend Quasar + Nginx)
# ============================================================

services:
  # ------------------------------------------------------------
  # Service 1: Database MariaDB (MySQL Compatible)
  # ------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: wahana_scan_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wahana_scan
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
      # Otomatis inisialisasi schema saat container pertama kali dibuat
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3308:3306"
    networks:
      - wahana_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # Service 2: Backend Perl uWSGI PSGI REST API Server
  # ------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wahana_scan_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: wahana_scan
      DB_USER: root
      DB_PASS: root
      WAHANA_API_PORT: 5000
      TZ: Asia/Jakarta
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    networks:
      - wahana_net

  # ------------------------------------------------------------
  # Service 3: Frontend Quasar (Node.js Dev Server)
  # ------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wahana_scan_frontend
    restart: unless-stopped
    environment:
      VITE_USE_LOCAL_DATA: "false"
      VITE_API_BASE_URL: ""
      TZ: Asia/Jakarta
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "9000:9000"
    networks:
      - wahana_net

  # ------------------------------------------------------------
  # Service 4: Nginx Reverse Proxy (Gateway)
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: wahana_scan_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/swagger-ui.html:/etc/nginx/html/swagger-ui.html:ro
      - ./backend/etc/api/scanresi.yaml:/etc/nginx/html/scanresi.yaml:ro
    ports:
      - "8080:80"
    networks:
      - wahana_net

  # ============================================================
  # OBSERVABILITY STACK (Auxiliary & Non-blocking)
  # ============================================================

  # ------------------------------------------------------------
  # Service 5: Prometheus (Metrics Collection & Storage)
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: wahana_scan_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - wahana_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------
  # Service 6: Loki (Centralized Log Engine)
  # ------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: wahana_scan_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - wahana_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------
  # Service 7: Promtail (Log Collector from Docker & Files)
  # ------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: wahana_scan_promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./backend/log:/var/log/backend:ro
    networks:
      - wahana_net
    depends_on:
      - loki

  # ------------------------------------------------------------
  # Service 8: Grafana (Visualization Dashboard)
  # ------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: wahana_scan_grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "none"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - wahana_net
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------
  # Service 9: cAdvisor (Container Resource & Hardware Metrics)
  # ------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: wahana_scan_cadvisor
    restart: unless-stopped
    privileged: true
    environment:
      TZ: Asia/Jakarta
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8088:8080"
    networks:
      - wahana_net

# ------------------------------------------------------------
# Networks & Volumes
# ------------------------------------------------------------
networks:
  wahana_net:
    driver: bridge

volumes:
  db_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
