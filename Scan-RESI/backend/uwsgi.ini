[uwsgi]
# =====================================================================
# uwsgi.ini — Konfigurasi uWSGI PSGI untuk Backend Scan Resi Wahana
# =====================================================================

# Plugin & Entrypoint PSGI
plugins = psgi
psgi = web.pl
chdir = %d

# Mode HTTP Socket (Dapat diakses langsung atau melalui reverse proxy Nginx)
http-socket = 0.0.0.0:5000
# socket = 127.0.0.1:5001

# Worker & Process Management
master = true
workers = 4
enable-threads = true
threads = 2
vacuum = true
die-on-term = true

# Buffer & Performance
buffer-size = 65535
post-buffering = 8192
max-requests = 5000
harakiri = 60

# Hot Reload otomatis saat file route diubah
touch-reload = lib/Wahana/Router.pm
perl-auto-reload = 3

# Logging
log-format = [%(ltime)] %(addr) "%(method) %(uri)" %(status) %(msecs)ms - %(size) bytes
